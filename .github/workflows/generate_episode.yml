name: Generate MOO19 Episode

on:
  schedule:
    - cron: '0 13 */4 * *' # Runs at 1:00 PM UTC every 4 days
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Episode Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_DOC_FILE_ID: ${{ vars.GOOGLE_DOC_FILE_ID }}
        run: python scripts/generate_episode.py

      - name: Commit and Push Episode Artifacts
        run: |
          git config --global user.name "MOO19-Bot"
          git config --global user.email "bot@moo19.tv"
          git add episodes/
          git diff-index --quiet HEAD || git commit -m "Auto-generated 3-column bundle: $(date +'%Y-%m-%d')"
          git push
