name: Generate MOO19 Episode

on:
  schedule:
    # Runs at 09:00 UTC every 4 days
    - cron: '0 9 */4 * *'
  workflow_dispatch: # Allows manual trigger anytime from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Episode Generator Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }} # Optional
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_episode.py

      - name: Commit and Push Episode Artifact
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generated episode $(date +'%Y-%m-%d')" && git push)
